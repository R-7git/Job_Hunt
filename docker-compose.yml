version: '3.8'

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: roshan_n8n
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
    volumes:
      - n8n_data:/home/node/.n8n
      - ./agent:/data/agent

volumes:
  n8n_data:
