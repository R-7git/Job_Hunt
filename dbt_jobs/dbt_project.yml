name: 'dbt_jobs'
version: '1.0.0'
config-version: 2

profile: 'dbt_jobs'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

vars:
  target_role: 'Data Engineering' # Ecosystem including DE, SQL, Snowflake, ETL
  experience_level: 'Fresher'     # Options: 'Fresher', 'All'
  remote_only: true              # Filter for fully remote roles

models:
  dbt_jobs:
    +materialized: view
