name: dbt CI Pipeline

on:
  pull_request:
    branches:
      - main
    paths:
      - 'dbt_jobs/**'
      - 'main.py'
      - '.github/workflows/dbt_ci.yml'

jobs:
  dbt-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "dbt-core<1.6.0" "dbt-sqlite<1.6.0"

      - name: Create Mock Database Directory & Profiles
        run: |
          mkdir -p data
          touch data/jobs.db
          mkdir -p ~/.dbt
          cat << 'PROFILE_EOF' > ~/.dbt/profiles.yml
          dbt_jobs:
            target: dev
            outputs:
              dev:
                type: sqlite
                database: 'main'
                schema: 'main'
                schema_directory: 'data'
                schemas_and_paths:
                  main: 'data/jobs.db'
                threads: 1
          PROFILE_EOF

      - name: Run dbt Transformations
        run: |
          dbt run --project-dir dbt_jobs --profiles-dir ~/.dbt

      - name: Run dbt Data Quality Tests
        run: |
          dbt test --project-dir dbt_jobs --profiles-dir ~/.dbt
